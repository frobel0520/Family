name: Redirect old GitHub Pages site

# Family 前端已改由 Family Worker 提供（見 worker/wrangler.jsonc 的 assets）。
# frobel0520.github.io 是所有 Pages 專案共用的 origin，任何一個站的腳本都讀得到別站的
# localStorage，所以這裡只發布一頁轉址：清掉舊版存在 localStorage 的 token，導到新網址。
# 新網址放在 repository variable FAMILY_APP_URL（例如 https://<worker>.<subdomain>.workers.dev/Family/）。

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml', 'pages-redirect/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build redirect page from template
        env:
          FAMILY_APP_URL: ${{ vars.FAMILY_APP_URL }}
        run: |
          # 只接受 workers.dev 的 /Family/ 網址；字元限制也讓下面的 sed 替換不會被特殊字元破壞。
          if ! printf '%s' "$FAMILY_APP_URL" | grep -Eq '^https://[a-z0-9-]+(\.[a-z0-9-]+)*\.workers\.dev/Family/$'; then
            echo "FAMILY_APP_URL must be https://<worker>.<subdomain>.workers.dev/Family/"
            exit 1
          fi
          mkdir -p site
          sed "s#__FAMILY_APP_URL__#${FAMILY_APP_URL}#g" pages-redirect/index.html > site/index.html
          if grep -q '__FAMILY_APP_URL__' site/index.html; then echo "placeholder not replaced"; exit 1; fi
          cp site/index.html site/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
